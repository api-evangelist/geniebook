name: Geniebook
description: >-
  Geniebook is a Singapore-based educational technology company (Geniebook Pte
  Ltd, incorporated 2016) offering an AI-powered online learning platform for
  primary, secondary, and JC students. Its product suite includes GenieSmart
  (AI-personalised worksheets generated from a library of 300,000+ MOE
  syllabus-aligned questions, using algorithms co-developed with A*STAR),
  GenieClass (live and recorded online classes taught by experienced teachers),
  and GenieAsk (real-time moderated teacher chats for after-school academic
  support), plus a CAMPUS physical-tutoring offering and PSLE/JC preparation
  programmes. Geniebook serves more than 220,000 students across Singapore,
  Vietnam, Malaysia, and Indonesia, and is backed by Lightspeed Venture
  Partners. It is a consumer (B2C) learning application delivered via web and
  mobile apps; no public developer API is published.
